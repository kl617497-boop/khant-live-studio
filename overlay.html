<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KhantAi Overlay</title><style>body{margin:0;background:transparent;font-family:Arial,sans-serif;color:#ffe2a0;display:grid;place-items:center;min-height:100vh;text-align:center}.box{background:#111d;border:2px solid #caa54a;border-radius:24px;padding:30px 50px;box-shadow:0 0 35px #e8b94588}.icon{font-size:90px}.name{font-size:32px;font-weight:bold}.hide{display:none}</style></head><body><div class="box hide" id="box"><div class="icon" id="icon"></div><div class="name" id="name"></div><p id="details"></p></div><script>const ch=new BroadcastChannel('khantai-overlay');let timer;ch.onmessage=({data:e})=>{document.getElementById('icon').textContent=e.icon;document.getElementById('name').textContent=e.name;document.getElementById('details').textContent=e.gift+' × '+e.qty+' · '+e.coins.toLocaleString()+' coins';document.getElementById('box').classList.remove('hide');clearTimeout(timer);timer=setTimeout(()=>document.getElementById('box').classList.add('hide'),6500)};</script></body></html>
